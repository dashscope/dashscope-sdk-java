name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Version must match tag
        run: |
          V=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          test "v$V" = "$GITHUB_REF_NAME"

      - name: Pre-download Qwen tokenizer vocab
        run: |
          vocab_dir="$HOME/.cache/dashscope/tokenizers"
          vocab="$vocab_dir/qwen.tiktoken"
          sha256="b2b1b8dfb5cc5f024bafc373121c6aba3f66f9a5a0269e243470a1de16a33186"
          url="https://www.modelscope.cn/models/Qwen/Qwen-7B-Chat/resolve/master/qwen.tiktoken"
          mkdir -p "$vocab_dir"
          for attempt in 1 2 3; do
            if curl -fsSL --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 5 \
                -o "$vocab" "$url" && [ "$(sha256sum "$vocab" | cut -d' ' -f1)" = "$sha256" ]; then
              echo "Vocab cached at $vocab"
              exit 0
            fi
            echo "Vocab download attempt $attempt failed, retrying..."
            sleep 10
          done
          echo "::error::Failed to download qwen.tiktoken from ModelScope after 3 attempts"
          exit 1

      - name: Unit tests
        run: mvn -B test

      - name: Deploy to Maven Central
        run: mvn -B deploy -DskipTests -DautoPublish=${{ vars.AUTO_PUBLISH || 'false' }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}